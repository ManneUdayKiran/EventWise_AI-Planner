name: EventWise AI CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-checks:
    name: Backend Linting, Security & Pytest
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Eventwise_AI/backend/requirements.txt

      - name: Run Ruff Linting & Formatting Check
        run: |
          cd Eventwise_AI/backend
          ruff check .
          ruff format --check .

      - name: Run Pytest Test Suite
        env:
          MONGODB_URL: mongodb://localhost:27017
          DB_NAME: eventwise_test_ci
          SECRET_KEY: test-ci-super-secret-key-that-is-at-least-32-chars!
        run: |
          cd Eventwise_AI/backend
          pytest -v --cov=app --cov-report=term-missing

  frontend-checks:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Eventwise_AI/frontend/package.json

      - name: Install dependencies
        run: |
          cd Eventwise_AI/frontend
          npm ci || npm install

      - name: Run ESLint
        run: |
          cd Eventwise_AI/frontend
          npm run lint

      - name: Run TypeScript Check
        run: |
          cd Eventwise_AI/frontend
          npm run typecheck

      - name: Run Vitest Unit Tests
        run: |
          cd Eventwise_AI/frontend
          npm run test
